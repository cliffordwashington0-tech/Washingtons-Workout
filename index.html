<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garage Prehab Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prehab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceeec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141618" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, sticky tab strip, stacked cards; plate-stamp condensed caps for headings, rack red for the one action per card. */
:root{
  --bg:#eceeec; --card:#fbfcfb; --ink:#1b1e22; --mute:#5c656c; --line:#d2d7d5;
  --accent:#c4352b; --accent-ink:#ffffff; --steel:#33475b; --good:#1f7a4d; --warn:#a86200;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141618; --card:#1e2124; --ink:#ecece7; --mute:#9aa3a9; --line:#353a3f;
    --accent:#f0604f; --accent-ink:#1c0c0a; --steel:#a5bbd0; --good:#5cc68d; --warn:#e3a646;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141618; --card:#1e2124; --ink:#ecece7; --mute:#9aa3a9; --line:#353a3f;
  --accent:#f0604f; --accent-ink:#1c0c0a; --steel:#a5bbd0; --good:#5cc68d; --warn:#e3a646;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 8px}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.status{font-size:13px;color:var(--mute);text-align:right}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0 10px}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;text-align:center;text-decoration:none;color:var(--mute);padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
nav.tabs a[aria-current="page"]{color:var(--accent-ink);background:var(--steel);border-color:var(--steel)}
:root[data-theme="dark"] nav.tabs a[aria-current="page"]{color:#141618}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs a[aria-current="page"]{color:#141618}}
main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.1;text-wrap:balance}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.good{color:var(--good);border-color:var(--good)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.bad{color:var(--accent);border-color:var(--accent)}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;cursor:pointer}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.done{background:var(--good);border-color:var(--good);color:var(--card)}
button.small{padding:5px 9px;font-size:13px;font-weight:500}
button.link{border:0;background:none;padding:0;color:var(--steel);text-decoration:underline;font-weight:500;font-size:14px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);flex:1 1 120px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav strong{font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.cue{font-size:14px;color:var(--mute)}
.cue b{color:var(--ink);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:6px;align-items:center}
.set span.n{font-size:13px;color:var(--mute);text-align:center}
.set button{padding:8px 0;font-size:13px}
.bar{height:10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.over{background:var(--accent)}
.big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.meal{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.dots{display:flex;gap:4px}
.dots i{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);background:var(--bg);display:block}
.dots i.on{background:var(--good);border-color:var(--good)}
.dots i.today{outline:2px solid var(--steel);outline-offset:1px}
.person{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.person:first-of-type{border-top:0;padding-top:0}
.sched{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:15px}
.sched button{justify-self:start}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.note{border-left:3px solid var(--warn);padding-left:10px;font-size:14px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:10px}
[hidden]{display:none!important}
#timer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--steel);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px}
#timer .tl{font-size:13px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
#timer .tt{font-family:var(--display);font-weight:700;font-size:38px;line-height:1}
#timer button{background:transparent;color:var(--bg);border-color:var(--bg)}
body.timing .wrap{padding-bottom:120px}
@media (prefers-reduced-motion: no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Garage Prehab</h1>
    <div class="status" id="status">Loading your log</div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-tab="today">Today</a>
    <a href="#plan" data-tab="plan">Plan</a>
    <a href="#food" data-tab="food">Food</a>
    <a href="#us" data-tab="us">Us</a>
  </nav>
  <main id="app"></main>
</div>
<div id="timer" hidden role="timer" aria-live="off">
  <div><div class="tl" id="t-label">Rest</div><div class="tt" id="t-time">0:00</div></div>
  <div class="row"><button id="t-add">+15 sec</button><button id="t-stop">Stop</button></div>
</div>
<script>
"use strict";
/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const monday=s=>addDays(s,-((parse(s).getDay()+6)%7));
const fmt=(s,o)=>parse(s).toLocaleDateString('en-US',o||{weekday:'short',month:'short',day:'numeric'});
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const money=n=>(n<0?'-':'')+'$'+Math.abs(n).toFixed(Math.abs(n)%1?2:0);
const today=()=>ymd(new Date());

/* ---------- the program ---------- */
const START='2026-11-12', END='2026-12-11', DELOAD='2026-12-07', FIRST_STAKE_WEEK='2026-11-16';
const EX={
  zs:{name:'Zercher squat',unit:'lb',cue:'Bar in the crooks of your elbows, hands clasped. 3 seconds down, pause, stand. Stop the set if the knee shifts or gives.',
      sub:{name:'Spanish squat (band)',cue:'Loop the band around a rack upright and behind both knees. Sit back with shins vertical. 10 to 12 slow reps.'}},
  zs2:{name:'Zercher squat, lighter',unit:'lb',log:'zs2',cue:'10 to 15% under your Day A weight. Same slow tempo.',
      sub:{name:'Spanish squat (band)',cue:'Band around an upright and behind both knees, shins vertical, 12 slow reps.'}},
  pu:{name:'Pull-ups',unit:'+lb',cue:'<b>Grip:</b> overhand, hands just outside your shoulders, thumbs wrapped, on the straight middle of the bar. Stop 1 to 2 reps before failure.',
      sub:{name:'Band-assisted pull-up',cue:'Loop the band over the bar and put one knee in it. Same overhand grip. If one band is not enough help, do lat pulldowns.'}},
  row:{name:'Barbell row',unit:'lb',cue:'<b>Grip:</b> overhand, shoulder width. Pull to your lower ribs.',
      sub:{name:'Banded row',cue:'Band around an upright at belly height. Pull elbows back, 15 reps.'}},
  hang:{name:'Dead hang',unit:'+lb',reps:'sec',cue:'<b>Grip:</b> overhand, same width as your pull-ups. Step down from the bar, never drop.',
      sub:{name:'Feet-assisted hang',cue:'Toes on a box or the floor, taking part of your weight.'}},
  epu:{name:'Explosive pull-ups',unit:'+lb',cue:'<b>Grip:</b> overhand, a thumb-length wider than your shoulders, knuckles rolled over the top of the bar. Pull the bar to your lower chest. No kipping.',
      sub:{name:'Banded explosive pull-up',cue:'Knee in the band. Pull as high and fast as you can, lower under control.'}},
  sbd:{name:'Straight-bar dips',unit:'+lb',cue:'Barbell racked at waist height. <b>Grip:</b> overhand, shoulder width. Lean your chest over the bar and press to lockout.',
      sub:{name:'Feet-assisted bar dip',cue:'Lower the bar a notch and keep your toes on the floor. Push with your legs only as much as you need.'}},
  tr:{name:'Banded muscle-up transitions',unit:'',cue:'Bar at chest height, feet on the floor, band looped from the bar under your hips. Pull to your chest, then roll wrists and chest over the bar into the dip. <b>Grip:</b> overhand, same as explosive pull-ups.',
      sub:{name:'Banded straight-arm pulldown',cue:'Band over the pull-up bar. Arms straight, sweep your hands to your hips. 12 reps.'}},
  lat:{name:'Lat pulldown',unit:'lb',cue:'<b>Grip:</b> overhand, slightly wider than your pull-up grip. Pull to your upper chest.',
      sub:{name:'Banded pulldown',cue:'Band over the bar, kneel, pull elbows to your ribs. 15 reps.'}},
  push:{name:'Push-ups',unit:'',cue:'Stop 1 to 2 reps before failure.',
      sub:{name:'Incline push-up',cue:'Hands on the barbell racked at hip height.'}},
  neg:{name:'Pull-up negatives',unit:'+lb',cue:'<b>Grip:</b> overhand for sets 1 and 2, underhand for sets 3 and 4 to spare your elbows. Step up from a box, lower for 5 seconds, step off.',
      sub:{name:'Band-assisted negative',cue:'Knee in the band, same 5-second lower.'}},
  hold:{name:'Zercher hold',unit:'lb',reps:'sec',cue:'Unrack and stand tall, ribs down. Take slow steps on the mat only if the knee feels stable.',
      sub:{name:'Banded Pallof press',cue:'Band on an upright at chest height. Press out and hold 3 seconds, 10 reps each side.'}},
  hkr:{name:'Hanging knee raises',unit:'',cue:'<b>Grip:</b> overhand. No swing. Step down after each set.',
      sub:{name:'Lying knee raise',cue:'On the mat, lower back pressed down, 12 reps.'}}
};
const REST={zs:150,zs2:120,pu:120,epu:120,neg:120,sbd:90,row:90};
const WORK={hang:30,hold:30};
const IDEAS={
  knee:{name:'Knee prehab, 15 min',note:'Standard pre-surgery ACL work. Clear it with your PT first.',items:['Quad sets: 3 x 10, hold 5 sec','Straight leg raises: 3 x 10 each leg','Heel slides: 2 x 15','Glute bridges: 3 x 12','Spanish squat hold with band: 3 x 30 sec','Calf raises holding the rack: 3 x 15']},
  band:{name:'Band-only upper body, 20 min',items:['Banded row: 4 x 15','Banded pulldown: 4 x 12','Band pull-aparts: 3 x 20','Banded push-ups: 3 x max - 2','Banded curls: 3 x 15','Banded triceps pressdown: 3 x 15']},
  grip:{name:'Grip and hang practice, 10 min',items:['Dead hang: 4 x 20-30 sec','Scapular pull-ups: 3 x 8','Top-of-pull-up hold from a box: 4 x 10 sec','Plate pinch hold: 3 x 30 sec']},
  core:{name:'Core, 10 min',items:['Dead bug: 3 x 10 each side','Side plank: 3 x 20 sec each side','Banded Pallof press: 3 x 10 each side','Lying knee raise: 3 x 12']},
  walk:{name:'Walking pad intervals, 30 min',items:['5 min easy','10 rounds: 1 min brisk, 1 min easy','5 min easy']},
  body:{name:'No-equipment full body, 20 min',items:['Sit-to-stand from a chair: 3 x 12','Incline push-ups: 3 x 10','Glute bridges: 3 x 15','Bird dog: 3 x 8 each side','Plank: 3 x 30 sec']}
};
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const SESS={
  A:{title:'Day A',sub:'Zercher strength',ex:[['zs',4,'6'],['pu',5,'max - 2'],['row',3,'8'],['hang',3,'20-30 sec']]},
  B:{title:'Day B',sub:'Muscle-up skill',ex:[['epu',6,'2-3'],['sbd',4,'5-8'],['tr',4,'3-5'],['lat',3,'10'],['push',3,'max - 2']]},
  C:{title:'Day C',sub:'Volume',ex:[['zs2',3,'8'],['neg',4,'3'],['hold',3,'30 sec'],['hkr',3,'10']]},
  S:{title:'Optional skill day',sub:'Short practice, then walk',ex:[['epu',4,'2'],['tr',3,'3']]},
  W:{title:'Walk day',sub:'45 to 60 minutes on the pad',ex:[]}
};
function sessionFor(s){
  if(s<START||s>END) return null;
  if(s==='2026-11-12') return {k:'A',deload:false};
  if(s==='2026-11-13') return {k:'B',deload:false};
  const k={1:'A',2:'W',3:'B',4:'S',5:'C'}[parse(s).getDay()];
  return k?{k,deload:s>=DELOAD}:null;
}

/* ---------- state ---------- */
const LS='garage-prehab-v1';
const me={profile:null,days:{}};
const dirty={}, ver={};
let connecting=false;
const others={};
let mode='loading', db=null, uid=null, sample=null, canImg=false, writeBlocked=false, saveNote='';
let cur=today(), tab='today', pending=null, foodErr='';
const blankDay=()=>({done:false,sets:{},swap:{},note:'',walk:'',weight:'',meals:[],idea:''});
const norm=d=>Object.assign(blankDay(),d||{});
const day=s=>me.days[s]||(me.days[s]=blankDay());
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){me.profile=j.profile||null;Object.keys(j.days||{}).forEach(k=>me.days[k]=norm(j.days[k]));Object.assign(dirty,j.dirty||{});}}catch(e){}}
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify({profile:me.profile,days:me.days,dirty}));}catch(e){}}

/* ---------- saving ---------- */
const timers={}, chains={};
function push(key,path,get){
  const v=ver[key];
  chains[path]=(chains[path]||Promise.resolve()).then(()=>db.doc(path).set(clone(get()))).then(()=>{if(ver[key]===v){delete dirty[key];cacheLocal();}saveNote='';setStatus();}).catch(e=>{
    const c=e&&e.code;
    if(c==='invalid_argument'||c==='not_granted'||c==='revoked'){mode='local';writeBlocked=true;render();}
    else{saveNote='Not synced yet. Your entries are saved on this phone.';setStatus();}
  });
}
function saveDay(s){dirty[s]=1;ver[s]=(ver[s]||0)+1;cacheLocal();if(mode!=='cloud')return;clearTimeout(timers[s]);timers[s]=setTimeout(()=>push(s,'people/'+uid+'/days/'+s,()=>me.days[s]),700);}
function saveProfile(){dirty._p=1;ver._p=(ver._p||0)+1;cacheLocal();if(mode!=='cloud')return;clearTimeout(timers._p);timers._p=setTimeout(()=>push('_p','people/'+uid,()=>me.profile),300);}
function flush(){
  if(mode!=='cloud')return;
  Object.keys(dirty).forEach(k=>{
    if(k==='_p'){if(me.profile)push('_p','people/'+uid,()=>me.profile);}
    else if(me.days[k])push(k,'people/'+uid+'/days/'+k,()=>me.days[k]);
  });
}
function setStatus(){
  const el=document.getElementById('status');
  el.textContent=(window.claude&&navigator.onLine===false?'Offline. Saving on this phone, syncs when you reconnect':'')||saveNote||(mode==='cloud'?'Synced to your shared log':mode==='loading'?'Loading your log':'Saved on this phone');
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'unavailable'}),ms))]);

async function connect(){
  if(connecting||db)return;
  connecting=true;
  try{await connect2();}finally{connecting=false;}
}
async function connect2(){
  if(!window.claude||!claude.use){mode='local';return render();}
  let d=null,u=null,s=null;
  try{[d,u,s]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')]);}catch(e){}
  if(s){sample=s;try{const l=await s.limits();canImg=!!(l&&l.images);}catch(e){}}
  let id=null;try{id=u?await u.id():null;}catch(e){}
  if(!d||!id){mode='local';return render();}
  db=d;uid=id;
  try{
    const [ps,ds]=await withTimeout(Promise.all([db.doc('people/'+uid).get(),db.collection('people/'+uid+'/days').get()]),10000);
    if(ps.exists){
      if(!(dirty._p&&me.profile))me.profile=clone(ps.data());
      const merged={};
      ds.docs.forEach(x=>{merged[x.id]=norm(clone(x.data()));});
      Object.keys(dirty).forEach(k=>{if(k!=='_p'&&me.days[k])merged[k]=me.days[k];});
      Object.keys(me.days).forEach(k=>delete me.days[k]);
      Object.assign(me.days,merged);
      mode='cloud';cacheLocal();flush();
    }else{
      mode='cloud';
      if(me.profile){dirty._p=1;Object.keys(me.days).forEach(k=>{dirty[k]=1;});flush();}
    }
  }catch(e){db=null;uid=null;mode='local';return render();}
  db.collection('people').onSnapshot(snap=>{
    snap.docs.forEach(x=>{
      if(x.id===uid)return;
      const o=others[x.id]||(others[x.id]={profile:null,days:{},sub:false});
      o.profile=clone(x.data());
      if(!o.sub){o.sub=true;db.collection('people/'+x.id+'/days').onSnapshot(s2=>{o.days={};s2.docs.forEach(y=>{o.days[y.id]=norm(clone(y.data()));});softRender();},()=>{});}
    });
    softRender();
  },()=>{});
  render();
}
function softRender(){
  if(tab!=='us')return;
  const a=document.activeElement;
  if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  render();
}

/* ---------- views ---------- */
function dateNav(){
  const t=today();
  return `<div class="datenav">
    <button class="small" data-act="prev" aria-label="Previous day">&larr;</button>
    <div class="row"><strong>${esc(fmt(cur))}</strong>${cur===t?'<span class="chip good">Today</span>':`<button class="link" data-act="gotoday">Go to today</button>`}</div>
    <button class="small" data-act="next" aria-label="Next day">&rarr;</button></div>`;
}
function lastFor(id,before){
  const key=EX[id].log||id;
  const ks=Object.keys(me.days).filter(k=>k<before).sort().reverse();
  for(const k of ks){
    const d=me.days[k];
    for(const cand of [id,key==='zs2'?'zs2':id]){
      const rows=(d.sets||{})[cand];
      if(rows&&!(d.swap||{})[cand]){const r=rows.filter(x=>x&&(x.w||x.r));if(r.length){const b=r[r.length-1];return `${fmt(k,{month:'short',day:'numeric'})}: ${esc(b.w||'bodyweight')} x ${esc(b.r||'?')}`;}}
    }
  }
  return '';
}
function exHTML(d,[id,sets,reps],deload){
  const e=EX[id], sw=!!d.swap[id], show=sw?e.sub:e;
  const rows=d.sets[id]||[], n=Math.max(deload?Math.max(2,sets-1):sets,rows.length);
  const last=sw?'':lastFor(id,cur);
  let h=`<div class="ex"><div class="row between"><h3>${esc(show.name)}</h3><span class="chip">${deload?Math.max(2,sets-1):sets} x ${esc(reps)}</span></div>
  <p class="cue">${show.cue}</p>
  ${last?`<p class="mute">Last time, ${last}</p>`:''}
  ${!sw&&suggest(id,deload)?`<p class="mute">${esc(suggest(id,deload))}</p>`:''}
  <div class="sets">`;
  for(let i=0;i<n;i++){
    const r=rows[i]||{};
    h+=`<div class="set"><span class="n">${i+1}</span>

  else if(a==='addset'){const id=b.dataset.ex,x=(SESS[(sessionFor(cur)||{}).k]||{ex:[]}).ex.find(e=>e[0]===id);const s=sessionFor(cur);const base=x?(s&&s.deload?Math.max(2,x[1]-1):x[1]):0;const rows=d.sets[id]||(d.sets[id]=[]);const want=Math.min(12,Math.max(base,rows.length)+1);while(rows.length<want)rows.push({});saveDay(cur);}
  else if(a==='rest'){startTimer([{label:'Rest',secs:+b.dataset.secs||REST[b.dataset.ex]||75}]);return;}
  else if(a==='work'){startTimer([{label:'Get set',secs:5},{label:b.dataset.ex?EX[b.dataset.ex].name:'Work',secs:+b.dataset.secs||WORK[b.dataset.ex]||30}]);return;}
  else if(a==='idea'){d.idea=b.dataset.key!==undefined?b.dataset.key:val('idea-pick');saveDay(cur);}
  else if(a==='swap'){const id=b.dataset.ex;d.swap[id]=!d.swap[id];saveDay(cur);}
  else if(a==='done'){d.done=!d.done;saveDay(cur);}
  else if(a==='saveprofile'){
    const name=val('pf-name');if(!name){document.getElementById('pf-name').focus();return;}
    me.profile=Object.assign({},me.profile||{},{name,plan:val('pf-plan'),target:num(val('pf-target'))||3,stake:Math.max(0,num(val('pf-stake'))),joined:(me.profile&&me.profile.joined)||today()});
    saveProfile();
  }
  else if(a==='estimate'){const t=val('desc');if(!t){document.getElementById('desc').focus();return;}estimate(null,t);return;}
  else if(a==='addpending'){d.meals.push({name:val('pm-name')||'Meal',kcal:num(val('pm-k')),p:num(val('pm-p')),c:num(val('pm-c')),f:num(val('pm-f'))});pending=null;saveDay(cur);}
  else if(a==='discard'){pending=null;}
  else if(a==='addmanual'){const k=num(val('mm-k'));if(!k){document.getElementById('mm-k').focus();return;}d.meals.push({name:val('mm-name')||'Meal',kcal:k,p:num(val('mm-p')),c:0,f:0});saveDay(cur);}
  else if(a==='delmeal'){d.meals.splice(+b.dataset.i,1);saveDay(cur);}
  else if(a==='calc'){
    const c={sex:val('gc-sex'),age:num(val('gc-age')),w:num(val('gc-w')),ft:num(val('gc-ft')),inch:num(val('gc-in')),pace:num(val('gc-pace'))};
    if(!c.age||!c.w||!c.ft){foodErr='Enter age, weight and height to calculate a goal.';render();return;}
    const kg=c.w*0.4536, cm=(c.ft*12+c.inch)*2.54;
    const bmr=10*kg+6.25*cm-5*c.age+(c.sex==='f'?-161:5), tdee=bmr*1.4;
    const goal=Math.max(c.sex==='f'?1300:1700,Math.round((tdee-c.pace)/10)*10);
    me.profile=Object.assign({},me.profile||{name:'',plan:'program',target:3,stake:20,joined:today()},{calc:c,kcalGoal:goal,proteinGoal:Math.min(200,Math.round(c.w*0.8/5)*5)});
    foodErr='';saveProfile();
  }
  render();
});
const ERR={not_granted:'Claude is not allowed on this page for your account, so photo estimates are off. Add the meal by hand.',sampling_disabled:'Claude is not available for this account. Add the meal by hand.',rate_limited:'Too many requests or you hit a usage limit. Try again later.',session_expired:'Sign in to Claude again, then retry.',image_rejected:'That photo could not be read. Try a different one.',images_unavailable:'Photos are not available in this view. Describe the meal instead.',refused:'Claude could not estimate that. Try a clearer photo or describe the meal.',invalid_json:'The estimate came back garbled. Try again.'};
async function estimate(file,text){
  if(!sample)return;
  pending={loading:true};foodErr='';render();
  const prompt='You estimate nutrition for a food log. '+(file?'The attached image is a photo of a meal, a drink, or a nutrition label. ':'')+(text?'The person describes it as: "'+text.slice(0,500)+'". ':'')+
    'Identify each food, estimate the portion as eaten, and estimate nutrition. Reply with only JSON in this shape: {"name": short meal name, "items": [{"name": string, "portion": string, "kcal": number, "protein": number, "carbs": number, "fat": number}], "confidence": "low" or "medium" or "high", "note": one short sentence on the biggest uncertainty}. Grams for protein, carbs, fat. If there is no food, reply {"name":"","items":[],"confidence":"low","note":"No food found."}';
  try{
    const r=await sample.json(prompt,file?{images:[file],cache:false}:{cache:false,modelTier:'quick'});
    const items=Array.isArray(r&&r.items)?r.items.filter(i=>i&&typeof i==='object').map(i=>({name:String(i.name||'Item'),portion:String(i.portion||''),kcal:num(i.kcal),protein:num(i.protein),carbs:num(i.carbs),fat:num(i.fat)})):[];
    if(!items.length){pending=null;foodErr=(r&&r.note?String(r.note)+' ':'')+'Nothing to add. Try another photo or describe the meal.';}
    else pending={name:String((r&&r.name)||'Meal'),items,confidence:String((r&&r.confidence)||'medium'),note:String((r&&r.note)||''),
      kcal:items.reduce((a,i)=>a+i.kcal,0),p:items.reduce((a,i)=>a+i.protein,0),c:items.reduce((a,i)=>a+i.carbs,0),f:items.reduce((a,i)=>a+i.fat,0)};
  }catch(e){
    pending=null;const c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled')sample=null;
    if(c==='images_unavailable')canImg=false;
    foodErr=ERR[c]||'The estimate did not finish. Try again in a moment.';
  }
  if(tab==='food')render();
}
/* ---------- timers ---------- */
let T=null, actx=null, beeps=[];
function beepAt(delay,freq){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+delay;
    o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
    o.start(t);o.stop(t+0.65);beeps.push(o);
  }catch(e){}
}
function clearBeeps(){beeps.forEach(o=>{try{o.stop();o.disconnect();}catch(e){}});beeps=[];}
function scheduleBeeps(){
  clearBeeps();if(!T)return;
  let at=(T.end-Date.now())/1000;
  for(let i=T.i;i<T.phases.length;i++){if(i>T.i)at+=T.phases[i].secs;beepAt(Math.max(0,at),i===T.phases.length-1?880:660);}
}
function startTimer(phases){
  stopTimer();
  T={phases,i:0,end:Date.now()+phases[0].secs*1000,iv:setInterval(tick,200)};
  scheduleBeeps();
  document.getElementById('timer').hidden=false;document.body.classList.add('timing');tick();
}
function stopTimer(){
  if(T){clearInterval(T.iv);clearTimeout(T.hide);}
  T=null;clearBeeps();
  document.getElementById('timer').hidden=true;document.body.classList.remove('timing');
}
function tick(){
  if(!T||T.over)return;
  let left=(T.end-Date.now())/1000;
  while(left<=0&&T.i<T.phases.length-1){T.i++;T.end+=T.phases[T.i].secs*1000;left=(T.end-Date.now())/1000;try{navigator.vibrate&&navigator.vibrate(150);}catch(e){}}
  const L=document.getElementById('t-label'), V=document.getElementById('t-time');
  if(left<=0){
    T.over=true;clearInterval(T.iv);
    L.textContent=T.phases[T.i].label==='Rest'?'Rest over':'Time';V.textContent='Go';
    try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
    T.hide=setTimeout(stopTimer,5000);
  }else{L.textContent=T.phases[T.i].label;V.textContent=mmss(Math.ceil(left));}
}
document.getElementById('t-stop').addEventListener('click',stopTimer);
document.getElementById('t-add').addEventListener('click',()=>{if(!T||T.over)return;T.end+=15000;scheduleBeeps();tick();});
